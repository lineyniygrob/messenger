services:

  # GATEWAY
  gateway-nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-web
      - user-web
    networks:
      - public
      - internal

  # AUTH SERVICE
  auth-web:
    image: nginx:alpine
    container_name: auth-web
    volumes:
      - ./auth-service:/var/www/laravel
      - ./auth-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-php
    networks:
      - internal

  auth-php:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-php
    working_dir: /var/www/laravel
    volumes:
      - ./auth-service:/var/www/laravel
    env_file:
      - ./auth-service/.env
    depends_on:
      - auth-db
    networks:
      - internal

  auth-db:
    image: postgres:13
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - pg-data-auth:/var/lib/postgresql/data
    networks:
      - internal

  # USER SERVICE
  user-web:
    image: nginx:alpine
    container_name: user-web
    volumes:
      - ./user-service:/var/www/laravel
      - ./user-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-php
    networks:
      - internal

  user-php:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: user-php
    working_dir: /var/www/laravel
    volumes:
      - ./user-service:/var/www/laravel
    env_file:
      - ./user-service/.env
    depends_on:
      - user-db
    networks:
      - internal

  user-db:
    image: postgres:13
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASS}
    volumes:
      - pg-data-user:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  pg-data-auth:
  pg-data-user:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
